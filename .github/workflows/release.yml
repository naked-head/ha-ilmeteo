name: Release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-*}"
          echo "BASE_VERSION=${BASE}" >> $GITHUB_OUTPUT
      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.BASE_VERSION }}"/' \
            custom_components/ilmeteo/manifest.json
      - name: Extract changelog section
        id: changelog
        run: |
          awk -v ver="${{ steps.version.outputs.BASE_VERSION }}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "Extracted notes:"
          cat release_notes.md
      - name: Create release zip
        run: |
          cd custom_components/ilmeteo
          zip -r "${GITHUB_WORKSPACE}/ilmeteo.zip" . -x '*.pyc' -x '__pycache__/*'
      - name: Verify zip layout
        run: |
          unzip -l ilmeteo.zip | grep -q " manifest.json$" \
            || { echo "manifest.json non è nella root dello zip"; exit 1; }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ha-ilmeteo ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ilmeteo.zip